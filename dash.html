<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d0d0d">
    <title>Dashboard • Banco de Questões</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg: #0d0d0d; --surface: #181818; --surface-2: #222; --surface-3: #2a2a2a;
            --border: #2e2e2e; --border-light: #3a3a3a;
            --text: #f2f2f2; --text-2: #a0a0a0; --text-3: #606060;
            --accent: #5b8df0; --accent-bg: rgba(91,141,240,0.12);
            --correct: #3ecf8e; --correct-bg: rgba(62,207,142,0.1); --correct-border: rgba(62,207,142,0.3);
            --wrong: #f06060; --wrong-bg: rgba(240,96,96,0.1); --wrong-border: rgba(240,96,96,0.3);
            --warn: #f5a623; --radius: 6px; --radius-lg: 8px;
            --safe-bottom: env(safe-area-inset-bottom, 16px);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { 
            background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; 
            max-width: 900px; margin: 0 auto; padding: 0 20px calc(100px + var(--safe-bottom)); 
            min-height: 100vh; -webkit-font-smoothing: antialiased; font-size: 15px; 
        }
        .hidden { display: none !important; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Header */
        .dash-header { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 24px 0; border-bottom: 1px solid var(--border); margin-bottom: 24px; 
        }
        .dash-title { font-size: 1.4rem; font-weight: 700; }
        .dash-subtitle { font-size: 0.85rem; color: var(--text-3); margin-top: 2px; }
        .back-link { 
            display: inline-flex; align-items: center; gap: 6px; 
            padding: 8px 14px; background: var(--surface); border: 1px solid var(--border); 
            border-radius: var(--radius); font-size: 0.85rem; font-weight: 600; 
            transition: all 0.15s; 
        }
        .back-link:hover { border-color: var(--accent); color: var(--accent); }

        /* Cards */
        .card { 
            background: var(--surface); border: 1px solid var(--border); 
            border-radius: var(--radius-lg); padding: 18px; margin-bottom: 16px; 
        }
        .card-title { 
            font-size: 0.75rem; font-weight: 700; color: var(--text-3); 
            text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; 
        }

        /* Stats Grid */
        .stats-grid { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; 
        }
        .stat-box { 
            background: var(--surface-2); border: 1px solid var(--border); 
            border-radius: var(--radius); padding: 14px; text-align: center; 
        }
        .stat-val { font-size: 1.8rem; font-weight: 700; line-height: 1; margin-bottom: 4px; }
        .stat-val.rating { color: var(--accent); }
        .stat-val.correct { color: var(--correct); }
        .stat-lbl { font-size: 0.7rem; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }

        /* Diagnosis List */
        .diag-list { display: flex; flex-direction: column; gap: 10px; }
        .diag-item { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 12px; background: var(--surface-2); border: 1px solid var(--border); 
            border-radius: var(--radius); 
        }
        .diag-info { min-width: 0; flex: 1; }
        .diag-topic { font-size: 0.9rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .diag-meta { font-size: 0.75rem; color: var(--text-3); margin-top: 2px; }
        .diag-meta strong { color: var(--wrong); }
        
        .diag-acc { 
            font-size: 1.1rem; font-weight: 700; margin-left: 12px; flex-shrink: 0; text-align: right;
        }
        .diag-acc-lbl { font-size: 0.6rem; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 2px; }
        .diag-acc.low { color: var(--wrong); }
        .diag-acc.mid { color: var(--warn); }
        .diag-acc.high { color: var(--correct); }

        /* Empty & Loading */
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-3); }
        .empty-state-title { font-size: 1.1rem; font-weight: 700; color: var(--text); margin-bottom: 6px; }
        .empty-state-text { font-size: 0.9rem; }
        
        .spinner { width: 30px; height: 30px; border: 2px solid var(--surface-3); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: 1fr; }
            .dash-header { flex-direction: column; align-items: flex-start; gap: 12px; }
        }
    </style>
</head>
<body>

<header class="dash-header">
    <div>
        <div class="dash-title">Dashboard Analítico</div>
        <div class="dash-subtitle">Sua evolução e diagnóstico de lacunas</div>
    </div>
    <a href="./" class="back-link">← Voltar ao Quiz</a>
</header>

<main id="dash-content">
    <div id="dash-loading" class="card" style="text-align: center; padding: 40px;">
        <div class="spinner"></div>
        <span style="color:var(--text-2);font-size:0.9rem;">Sincronizando banco de questões...</span>
    </div>

    <div id="dash-empty" class="card hidden">
        <div class="empty-state">
            <div class="empty-state-title">Nenhuma questão registrada</div>
            <div class="empty-state-text">Responda questões no quiz para mapearmos seu desempenho.</div>
            <div style="margin-top:16px;">
                <a href="./" class="back-link" style="padding:10px 20px;">Ir para o Quiz →</a>
            </div>
        </div>
    </div>

    <div id="dash-data" class="hidden">
        
        <div class="card">
            <div class="card-title">Desempenho Geral</div>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-val rating" id="stat-rating">0</div>
                    <div class="stat-lbl">Apex Rating</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val correct" id="stat-accuracy">0%</div>
                    <div class="stat-lbl">Precisão</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="stat-total">0</div>
                    <div class="stat-lbl">Questões</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title" style="color: var(--wrong);">Pontos de Atenção (Urgência)</div>
            <div class="diag-list" id="diag-list">
                </div>
        </div>

    </div>
</main>

<script>
const CONFIG = {
    BASE_RATING: 500, MIN_RATING: 0, MAX_RATING: 3000, K_FACTOR: 20, BLOCK_SIZE: 10,
    BEGINNER_THRESHOLD: 100, BEGINNER_BONUS: 5, NORMAL_BONUS: 1
};

const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1K9p0IyfTZ-tS21LdOdEHBbX34ZDETlCngVfigrnAKnc/gviz/tq?tqx=out:csv';

// Algoritmo de Rating
const calculateRating = (historyArray) => {
    if (!historyArray.length) return CONFIG.BASE_RATING;
    let rating = CONFIG.BASE_RATING;

    for (let i = 0; i < historyArray.length; i += CONFIG.BLOCK_SIZE) {
        const block = historyArray.slice(i, i + CONFIG.BLOCK_SIZE);
        const correctInBlock = block.filter(item => item.correct).length;
        const p = correctInBlock / block.length;
        
        const B = (i + block.length) <= CONFIG.BEGINNER_THRESHOLD ? CONFIG.BEGINNER_BONUS : CONFIG.NORMAL_BONUS;
        let delta = CONFIG.K_FACTOR * (p - 0.5) * B;

        if (delta > 0) {
            delta *= Math.max(0.1, (CONFIG.MAX_RATING - rating) / 2500);
        } else if (rating < CONFIG.BASE_RATING) {
            delta *= 0.3;
        }

        rating = Math.max(CONFIG.MIN_RATING, Math.min(CONFIG.MAX_RATING, rating + delta));
    }
    return Math.round(rating);
};

document.addEventListener('DOMContentLoaded', () => {
    const historicoRaw = localStorage.getItem('apex_historico');
    const loading = document.getElementById('dash-loading');
    const empty = document.getElementById('dash-empty');
    const dataPanel = document.getElementById('dash-data');

    if (!historicoRaw || historicoRaw === '{}') {
        loading.classList.add('hidden');
        empty.classList.remove('hidden');
        return;
    }

    const historico = JSON.parse(historicoRaw);

    // Baixa a planilha para cruzar com os IDs salvos
    Papa.parse(SHEET_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
            const banco = results.data;
            processDashboardData(banco, historico);
        },
        error: function() {
            loading.innerHTML = '<div style="color:var(--wrong);padding:20px;">Erro ao carregar o banco de dados. Verifique a conexão.</div>';
        }
    });

    function processDashboardData(banco, historico) {
        const historyArray = [];
        const topicStats = {};
        let totalQuestions = 0;
        let totalCorrect = 0;

        // Processa o localStorage cruzando com a planilha
        Object.entries(historico).forEach(([id, status]) => {
            const questao = banco.find(q => q.id === id);
            if (!questao) return; // Se a questão não existe mais no banco, ignora

            const isCorrect = status === 'correta';
            const topic = questao.tema_especifico || questao.especialidade || 'Geral';

            historyArray.push({ correct: isCorrect });
            totalQuestions++;
            if (isCorrect) totalCorrect++;

            if (!topicStats[topic]) {
                topicStats[topic] = { total: 0, correct: 0, errors: 0 };
            }
            topicStats[topic].total++;
            if (isCorrect) {
                topicStats[topic].correct++;
            } else {
                topicStats[topic].errors++;
            }
        });

        if (totalQuestions === 0) {
            loading.classList.add('hidden');
            empty.classList.remove('hidden');
            return;
        }

        // Renderiza Estatísticas Gerais
        const globalAccuracy = Math.round((totalCorrect / totalQuestions) * 100);
        const apexRating = calculateRating(historyArray);

        document.getElementById('stat-rating').textContent = apexRating;
        document.getElementById('stat-accuracy').textContent = globalAccuracy + '%';
        document.getElementById('stat-total').textContent = totalQuestions;

        // Calcula Diagnóstico (Ordenado por Urgência)
        const errorNodes = [];
        Object.entries(topicStats).forEach(([tema, stats]) => {
            if (stats.errors > 0) {
                const accuracy = stats.correct / stats.total;
                // Urgência = (Taxa de Erro) x Log10(Tentativas). 
                // Prioriza tópicos que o usuário erra muito E tenta muito.
                const urgency = (1 - accuracy) * Math.log10(stats.total + 1) * 100;
                
                errorNodes.push({
                    topic: tema,
                    acc: Math.round(accuracy * 100),
                    errors: stats.errors,
                    total: stats.total,
                    urgency: urgency
                });
            }
        });

        errorNodes.sort((a, b) => b.urgency - a.urgency);
        const topDiagnoses = errorNodes.slice(0, 10);
        const diagList = document.getElementById('diag-list');

        if (topDiagnoses.length === 0) {
            diagList.innerHTML = '<div style="color:var(--text-3);font-size:0.85rem;text-align:center;padding:20px;">Nenhum erro registrado ainda. Ótimo trabalho!</div>';
        } else {
            diagList.innerHTML = topDiagnoses.map(t => {
                const accClass = t.acc < 50 ? 'low' : t.acc < 75 ? 'mid' : 'high';
                return `
                    <div class="diag-item">
                        <div class="diag-info">
                            <div class="diag-topic">${t.topic}</div>
                            <div class="diag-meta"><strong>${t.errors} erros</strong> em ${t.total} tentativas</div>
                        </div>
                        <div>
                            <span class="diag-acc-lbl">Precisão</span>
                            <div class="diag-acc ${accClass}">${t.acc}%</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        loading.classList.add('hidden');
        dataPanel.classList.remove('hidden');
    }
});
</script>
</body>
</html>
